<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>该学习啦</title>
  <style>
    /* 配色、字体、圆角沿用 settings.html */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: "Microsoft YaHei UI", "Segoe UI", "PingFang SC", system-ui, sans-serif; background: #faf7f2; color: #2e2a26; font-size: 13px; user-select: none; }
    main { height: 100%; padding: 18px 24px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .dog { font-size: 44px; line-height: 1; }
    h1 { font-size: 20px; margin: 10px 0 6px; }
    .what { font-size: 14px; margin: 0; }
    .what b { color: #e0703f; }
    .friend { color: #8b847c; margin: 6px 0 0; min-height: 18px; }
    button { font: inherit; font-size: 14px; margin-top: 14px; border-radius: 9px; padding: 9px 26px; cursor: pointer; border: 1px solid #2e2a26; background: #2e2a26; color: #fff; }
    button:hover { background: #000; }
    .foot { margin: 12px 0 0; color: #8b847c; font-size: 12px; }
    .foot a { color: inherit; }
    .foot a:hover { color: #2e2a26; }
    select { font: inherit; color: #2e2a26; border: 1px solid #e0d8ce; border-radius: 7px; padding: 2px 4px; background: #fff; outline: none; cursor: pointer; }
    select:focus { border-color: #e5a96a; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div id="icon" class="dog">🐶</div>
    <h1 id="title">该学习啦！</h1>
    <!-- 连续摸鱼太久 -->
    <p id="whatSlack" class="what">你已经连续摸鱼 <b id="minutes">—</b> 了</p>
    <!-- 番茄钟：休息结束了还在摸鱼 -->
    <p id="whatFocus" class="what" hidden>休息时间结束了，新一轮 <b id="focusMinutes">—</b>专注已经开始</p>
    <p id="friend" class="friend"></p>
    <button id="ok" type="button">这就去学习 💪</button>
    <p id="footSlack" class="foot"><label for="next">还在摸鱼的话，再过</label> <select id="next"></select> 提醒我 · <a href="#" class="settings">设置</a></p>
    <p id="footFocus" class="foot" hidden>今天不想继续了？<a href="#" id="stopPomodoro">结束番茄钟</a> · <a href="#" class="settings">设置</a></p>
  </main>
  <script src="remind.js"></script>
</body>
</html>
