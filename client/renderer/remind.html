<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>该学习啦</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    /* 颜色、字号、圆角取自 tokens.css，和面板是同一套 */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: var(--font-family-body); background: var(--color-background-surface); color: var(--color-text-primary); font-size: var(--font-size-base); line-height: 1.4286; user-select: none; -webkit-font-smoothing: antialiased; }
    main { height: 100%; padding: var(--spacing-4) var(--spacing-6); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .dog { font-size: 44px; line-height: 1; }
    h1 { font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold); line-height: 1.4; margin: 10px 0 4px; }
    .what { margin: 0; color: var(--color-text-secondary); }
    .what b { color: var(--slack-ink); font-weight: var(--font-weight-semibold); }
    .friend { color: var(--color-text-secondary); font-size: var(--font-size-sm); margin: 6px 0 0; min-height: 20px; }
    button { font: inherit; font-weight: var(--font-weight-medium); margin-top: var(--spacing-3); height: var(--size-element-lg); border: 0; border-radius: var(--radius-element); padding: 0 var(--spacing-6); cursor: pointer; background: var(--color-accent); color: var(--color-on-accent); transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard); }
    button:hover { background: var(--color-accent-hover); }
    /* 「休息结束啦」：主按钮下面的小箭头，点开是「再休息一会」 */
    button.more { margin-top: 2px; height: 22px; padding: 0 22px; background: transparent; color: var(--color-text-disabled); font-size: 17px; line-height: 22px; }
    button.more:hover { background: transparent; color: var(--color-text-primary); }
    button.more[aria-expanded="true"] { transform: rotate(180deg); }
    button.ghost { margin-top: 2px; height: var(--size-element-md); padding: 0 var(--spacing-4); background: var(--color-neutral); color: var(--color-text-primary); }
    button.ghost:hover { background: var(--color-overlay-pressed); }
    .foot { margin: var(--spacing-3) 0 0; color: var(--color-text-secondary); font-size: var(--font-size-sm); }
    .foot a { color: inherit; text-underline-offset: 2px; border-radius: 4px; }
    .foot a:hover { color: var(--color-text-primary); }
    select { font: inherit; color: var(--color-text-primary); height: 24px; border: 1px solid var(--color-border-emphasized); border-radius: var(--radius-inner); padding: 0 4px; background: var(--color-background-surface); outline: none; cursor: pointer; }
    select:focus { border-color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div id="icon" class="dog">🐶</div>
    <h1 id="title">该学习啦！</h1>
    <!-- 连续摸鱼太久 -->
    <p id="whatSlack" class="what">你已经连续摸鱼 <b id="minutes">—</b> 了</p>
    <!-- 番茄钟：休息结束了，点了「重新开始」才开始下一轮 -->
    <p id="whatFocus" class="what" hidden>准备好了就开始新一轮 <b id="focusMinutes">—</b>专注</p>
    <p id="friend" class="friend"></p>
    <button id="ok" type="button">这就去学习 💪</button>
    <button id="resume" type="button" hidden>重新开始番茄钟 🍅</button>
    <button id="more" class="more" type="button" aria-expanded="false" aria-controls="restMore" title="还没休息够？" hidden>▾</button>
    <button id="restMore" class="ghost" type="button" hidden>再休息一会</button>
    <p id="footSlack" class="foot"><label for="next">还在摸鱼的话，再过</label> <select id="next"></select> 提醒我 · <a href="#" class="settings">设置</a></p>
    <p id="footFocus" class="foot" hidden>不想用番茄钟了？<a href="#" id="stopPomodoro">恢复默认模式</a> · <a href="#" class="settings">设置</a></p>
  </main>
  <script src="remind.js"></script>
</body>
</html>
