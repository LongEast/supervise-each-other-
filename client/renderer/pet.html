<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Buddy Pet</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="stage">
    <!-- 气泡区：收到戳一戳 / 自我提醒 -->
    <div id="bubble" class="bubble hit hidden"></div>

    <!-- 悬停信息卡 -->
    <div id="card" class="card hit hidden">
      <div class="card-head">
        <span id="cardName" class="card-name">搭子</span>
        <span id="cardBadge" class="badge">—</span>
      </div>
      <div id="cardWhat" class="card-what">—</div>
      <div id="cardStreak" class="card-streak hidden"></div>
      <div id="cardPomo" class="card-pomo hidden"></div>
      <!-- 今日学习 / 摸鱼：自己一行，搭子在线时再加一行 -->
      <div id="cardStats" class="stats"></div>
      <div id="cardPlan" class="card-plan hidden"></div>
      <div id="cardHint" class="card-hint">点我戳 TA 一下</div>
    </div>

    <!-- 点了卡片上的时长：这个人今天的学习 / 摸鱼时间都花在了哪些网站和应用上 -->
    <div id="detail" class="detail hit hidden">
      <div class="detail-head">
        <span id="detailWho" class="detail-who"></span><span id="detailTotal" class="detail-total"></span>
        <a href="#" id="detailBack" class="detail-back">‹ 返回</a>
      </div>
      <div id="detailList" class="detail-list"></div>
      <div id="detailNote" class="detail-note hidden"></div>
    </div>

    <!-- 点击菜单：戳一戳 -->
    <div id="menu" class="menu hit hidden">
      <div class="menu-title">戳 <b id="menuName">TA</b> 一下</div>
      <div class="presets">
        <button data-text="别摸鱼了！快回去学习 📚">别摸鱼了！</button>
        <button data-text="在干嘛呢？👀">在干嘛呢？</button>
        <button data-text="一起专注 25 分钟？🍅">一起专注 25min？</button>
        <button data-text="加油！你可以的 💪">加油 💪</button>
      </div>
      <form id="customForm" class="custom">
        <input id="customText" maxlength="140" placeholder="自定义一句话…" autocomplete="off" />
        <button type="submit">发送</button>
      </form>
      <div id="menuMsg" class="menu-msg"></div>
      <a href="#" id="journalLink" class="menu-link">📋 查看 TA 的今日计划/复盘</a>
      <div class="menu-foot">
        <a href="#" id="pauseLink">暂停分享我的状态</a>
        <a href="#" id="settingsLink">设置</a>
        <a href="#" id="closeLink">关闭</a>
      </div>
    </div>

    <!-- 小狗 -->
    <div id="petWrap" class="state-offline">
      <!-- 自己的番茄钟倒计时：小狗演谁都显示 -->
      <div id="pomo" class="pomo hidden"></div>
      <svg id="pet" class="hit" viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg" aria-label="搭子小狗">
        <ellipse cx="80" cy="132" rx="48" ry="6" class="shadow" />
        <!-- 形象一：小狗（默认）。两套形象用同样的 class（pup / head / tail / eye / prop-…），状态和动作的样式是共用的 -->
        <g class="skin skin-dog">
        <g class="pup">
          <g class="tail"><path d="M112 104 C130 100 134 82 124 74 C120 86 114 94 104 96 Z" class="fur-dark" /></g>
          <ellipse cx="80" cy="102" rx="38" ry="30" class="fur" />
          <ellipse cx="80" cy="108" rx="22" ry="20" class="belly" />
          <ellipse cx="64" cy="128" rx="10" ry="6" class="fur" />
          <ellipse cx="96" cy="128" rx="10" ry="6" class="fur" />
          <g class="head">
            <path d="M44 40 C30 44 28 72 40 80 C46 70 48 56 52 46 Z" class="fur-dark ear ear-l" />
            <path d="M116 40 C130 44 132 72 120 80 C114 70 112 56 108 46 Z" class="fur-dark ear ear-r" />
            <ellipse cx="80" cy="58" rx="38" ry="33" class="fur" />
            <ellipse cx="80" cy="72" rx="19" ry="13" class="belly" />
            <circle cx="56" cy="70" r="6" class="blush" />
            <circle cx="104" cy="70" r="6" class="blush" />
            <g class="eyes-open">
              <g class="eye"><circle cx="66" cy="56" r="5" class="ink" /><circle cx="67.6" cy="54.2" r="1.6" class="shine" /></g>
              <g class="eye"><circle cx="94" cy="56" r="5" class="ink" /><circle cx="95.6" cy="54.2" r="1.6" class="shine" /></g>
              <rect x="59" y="49" width="14" height="6" class="lid fur" />
              <rect x="87" y="49" width="14" height="6" class="lid fur" />
            </g>
            <g class="eyes-closed">
              <path d="M61 57 Q66 61 71 57" class="ink-line" />
              <path d="M89 57 Q94 61 99 57" class="ink-line" />
            </g>
            <ellipse cx="80" cy="66" rx="4.5" ry="3.2" class="ink" />
            <path d="M80 69 L80 73 M80 73 Q76 77 73 74 M80 73 Q84 77 87 74" class="ink-line thin" />
          </g>
          <!-- 学习：小电脑 -->
          <g class="prop prop-laptop">
            <path d="M60 104 L100 104 L104 124 L56 124 Z" class="laptop-screen" />
            <rect x="50" y="123" width="60" height="5" rx="2" class="laptop-base" />
            <circle cx="80" cy="114" r="2" class="laptop-logo" />
          </g>
          <!-- 摸鱼：手机 -->
          <g class="prop prop-phone">
            <rect x="92" y="96" width="14" height="24" rx="3" class="phone" />
            <rect x="94" y="99" width="10" height="16" rx="1.5" class="phone-glow" />
          </g>
        </g>
        </g>
        <!-- 形象二：小猫（右键小狗 →「换个形象」）。灰耳朵、灰头顶、黄绿眼睛；摸鱼、被逗的时候张嘴举爪 -->
        <g class="skin skin-cat">
        <g class="pup">
          <g class="tail">
            <path d="M104 120 C124 124 140 110 132 92" class="cat-tail-edge" />
            <path d="M104 120 C124 124 140 110 132 92" class="cat-tail-fill" />
          </g>
          <!-- 举起来的爪子：在身体后面，露出肉垫 -->
          <g class="paws-up">
            <ellipse cx="46" cy="93" rx="9.5" ry="9" class="fur" />
            <ellipse cx="45" cy="95" rx="3.6" ry="3" class="cat-pink" />
            <circle cx="40.5" cy="90.5" r="1.7" class="cat-pink" /><circle cx="45" cy="88.6" r="1.7" class="cat-pink" /><circle cx="49.5" cy="90.5" r="1.7" class="cat-pink" />
            <ellipse cx="114" cy="93" rx="9.5" ry="9" class="fur" />
            <g class="beans-r">
              <ellipse cx="115" cy="95" rx="3.6" ry="3" class="cat-pink" />
              <circle cx="110.5" cy="90.5" r="1.7" class="cat-pink" /><circle cx="115" cy="88.6" r="1.7" class="cat-pink" /><circle cx="119.5" cy="90.5" r="1.7" class="cat-pink" />
            </g>
          </g>
          <!-- 身体和两只脚跟小狗一样连成一块：先画一圈粗描边，再盖上不描边的白色，中间就没有线了 -->
          <g class="cat-edge">
            <ellipse cx="80" cy="106" rx="33" ry="25" /><ellipse cx="64" cy="127.5" rx="10" ry="6" /><ellipse cx="96" cy="127.5" rx="10" ry="6" />
          </g>
          <g class="cat-fill">
            <ellipse cx="80" cy="106" rx="33" ry="25" /><ellipse cx="64" cy="127.5" rx="10" ry="6" /><ellipse cx="96" cy="127.5" rx="10" ry="6" />
          </g>
          <path d="M60.5 129.5 v3.2 M65.5 130 v3.2 M94.5 130 v3.2 M99.5 129.5 v3.2" class="cat-toe" />
          <g class="head">
            <path d="M46.5 48 C45.5 41 46.5 33 48.5 28 Q50.5 21 57 24.5 C62 27 67 30 71 33.5 Z" class="fur-dark" />
            <path d="M50.5 40 L51 31.5 Q51.8 27.5 56 29.5 L62 32.5 Z" class="cat-ear-in" />
            <path d="M113.5 48 C114.5 41 113.5 33 111.5 28 Q109.5 21 103 24.5 C98 27 93 30 89 33.5 Z" class="fur-dark" />
            <path d="M109.5 40 L109 31.5 Q108.2 27.5 104 29.5 L98 32.5 Z" class="cat-ear-in" />
            <clipPath id="catHeadClip"><ellipse cx="80" cy="61" rx="38.5" ry="34" /></clipPath>
            <ellipse cx="80" cy="61" rx="38.5" ry="34" class="cat-fill" />
            <!-- 头顶两块灰，中间留一道白 -->
            <g clip-path="url(#catHeadClip)">
              <path d="M30 20 L77 20 C76.5 34 76 46 73.5 54 C70 60 50 59 30 56 Z" class="cat-patch" />
              <path d="M130 20 L83 20 C83.5 34 84 46 86.5 54 C90 60 110 59 130 56 Z" class="cat-patch" />
            </g>
            <ellipse cx="80" cy="61" rx="38.5" ry="34" class="cat-outline" />
            <g class="eyes-open">
              <g class="eye"><ellipse cx="62" cy="61" rx="7.5" ry="8.5" class="ink" /><ellipse cx="60.6" cy="62.4" rx="5.4" ry="6.2" class="cat-iris" /><ellipse cx="63.2" cy="60.6" rx="5.2" ry="6.2" class="ink" /><circle cx="65" cy="57.6" r="1.7" class="shine" /></g>
              <g class="eye"><ellipse cx="98" cy="61" rx="7.5" ry="8.5" class="ink" /><ellipse cx="96.6" cy="62.4" rx="5.4" ry="6.2" class="cat-iris" /><ellipse cx="99.2" cy="60.6" rx="5.2" ry="6.2" class="ink" /><circle cx="101" cy="57.6" r="1.7" class="shine" /></g>
              <!-- 半眯着的眼皮：平时和摸鱼时一脸得意 -->
              <clipPath id="catEyeClip"><ellipse cx="62" cy="61" rx="8.2" ry="9.2" /><ellipse cx="98" cy="61" rx="8.2" ry="9.2" /></clipPath>
              <g class="lid">
                <path d="M52 50 L72 50 L72 59.5 L52 55.5 Z M108 50 L88 50 L88 59.5 L108 55.5 Z" class="cat-patch" clip-path="url(#catEyeClip)" />
                <path d="M53 55.7 L71.5 59.4 M107 55.7 L88.5 59.4" class="ink-line thin" />
              </g>
            </g>
            <g class="eyes-closed">
              <path d="M55 62 Q62 67 69 62" class="ink-line" />
              <path d="M91 62 Q98 67 105 62" class="ink-line" />
            </g>
            <path d="M77.4 67 L82.6 67 L80 70 Z" class="cat-pink cat-nose" />
            <path d="M80 70.5 Q76.5 76 72 72.5 M80 70.5 Q83.5 76 88 72.5" class="ink-line thin mouth-closed" />
            <g class="mouth-open">
              <path d="M69 71.5 Q80 68.5 91 71.5 Q90.5 87 80 88 Q69.5 87 69 71.5 Z" class="cat-mouth" />
              <ellipse cx="80" cy="83" rx="6.4" ry="4" class="cat-pink" />
              <path d="M72.5 71.6 L75.2 76.6 L77.6 70.8 Z M87.5 71.6 L84.8 76.6 L82.4 70.8 Z" class="cat-fang" />
            </g>
          </g>
          <g class="prop prop-laptop">
            <path d="M60 104 L100 104 L104 124 L56 124 Z" class="laptop-screen" />
            <rect x="50" y="123" width="60" height="5" rx="2" class="laptop-base" />
            <circle cx="80" cy="114" r="2" class="laptop-logo" />
          </g>
          <!-- 摸鱼：右爪举着手机 -->
          <g class="prop prop-phone">
            <rect x="111" y="70" width="14" height="24" rx="3" class="phone" />
            <rect x="113" y="73" width="10" height="16" rx="1.5" class="phone-glow" />
          </g>
        </g>
        </g>
        <!-- 睡觉：Zzz -->
        <g class="prop prop-zzz">
          <text x="118" y="34" class="z z1">Z</text>
          <text x="130" y="22" class="z z2">z</text>
          <text x="140" y="12" class="z z3">z</text>
        </g>
      </svg>
      <div id="nametag" class="nametag hit"><span id="dot" class="dot"></span><span id="nameText">未连接</span></div>
    </div>
  </div>
  <script src="names.js"></script>
  <script src="pet-view.js"></script>
  <script src="pet.js"></script>
</body>
</html>
